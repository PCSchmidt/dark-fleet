name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python test dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(python -c 'import sys;print(sys.executable)')"
        shell: bash
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ tests (includes the information-leak fuzz harness)
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python tests (schemas, binding, leak checks)
        run: python -m pytest python/tests -q
